name: iosApp
options:
  bundleIdPrefix: il.cet.bonus
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    ENABLE_BITCODE: NO
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
      - path: ../shared/src/commonMain/composeResources/files
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.cet.bonus.ios
        PRODUCT_NAME: Bonus
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signing is left on "Automatic" so it's easy to pick your own Apple ID team
        # in Xcode's Signing & Capabilities tab before running on a physical iPad.
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          export JAVA_HOME=/opt/homebrew/opt/openjdk@17
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        # Intentionally no inputFiles/outputFiles: this script's real inputs are all of
        # shared/src/**, which Xcode has no way to track declaratively here, so it must
        # always re-run (and let Gradle's own incremental build decide what's stale).
        alwaysOutOfDate: true
